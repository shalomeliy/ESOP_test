[pytest]
testpaths = tests

# הערה מכוונת: אין כאן filterwarnings = error.
# starlette 1.3.1 מוציא StarletteDeprecationWarning בכל שימוש ב-TestClient מעל httpx
# (הוא מעדיף httpx2). הפיכת אזהרות לשגיאות תפיל כל בדיקת endpoint על אזהרה שאינה
# באג של המערכת הנבדקת - ולכן גם לא נוסיף ignore נקודתי שיסתיר אותה מהעין.

markers =
    intentional_bug: מתעד באג *מכוון* מ-qa_bug_accounts.md. הבדיקה מאשרת שהבאג עדיין משחזר; אין לתקן אותו.
